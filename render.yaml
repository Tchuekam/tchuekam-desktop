# Render Blueprint for Tchuekam Agent Backend
# Infrastructure as Code (IaC) definition
databases:
  - name: tchuekam-agent-db
    databaseName: tchuekam_agent_prod
    user: tchuekam_admin
    plan: starter
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: tchuekam-agent-api
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /healthz
    autoDeploy: true
    scaling:
      minInstances: 1
      maxInstances: 1
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: tchuekam-agent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: API_PREFIX
        value: /api/v1
      - key: CORS_ORIGIN
        value: "https://tchuekam.com,https://app.tchuekam.com,tchuekam://*,http://localhost:5173,http://localhost:5174"
