# Nixpacks build for the TchueKAM SaaS API (tchuekam_backend, FastAPI).
#
# The start command previously launched `hermes_cli.main dashboard` — the
# single-operator desktop dashboard, which spawns a PTY-backed TUI per session
# and never served the multi-tenant API. See Procfile for the same correction.
#
# `scripts/db_migrate.py` wraps `alembic upgrade head` in a Postgres advisory
# lock, so running it from every instance's start command is safe: one
# instance migrates, the others wait and then boot on the migrated schema.

[phases.setup]
nixPkgs = ["python311", "nodejs_22", "ffmpeg", "ripgrep", "git"]

[phases.install]
cmds = [
    "pip install -r requirements-backend.txt && pip install -e ."
]

[start]
cmd = "python scripts/db_migrate.py && gunicorn -c gunicorn.conf.py tchuekam_backend.main:app"
