[build]
  command = "npm run build"
  publish = "hermes_cli/web_dist"

[[redirects]]
  from = "/api/*"
  to = "https://relay-gateway-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
